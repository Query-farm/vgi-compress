#
# Build and publish the multi-arch vgi-compress image to ghcr.io. The heavy
# lifting (multi-arch build -> per-arch /health boot smoke -> image SQL suite ->
# push -> manifest -> cosign-sign) lives in the shared reusable workflow
# Query-farm/vgi-actions; this file gates on the repo's own test suite and
# supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z/:X.Y/:latest, push to release tags only (no :edge image on pushes to main). Publishing a
# GitHub Release creates the tag, which fires this too.
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite, so a
  # broken worker is never imaged. ci.yml's `audit` job requests `checks: write`
  # (rustsec/audit-check posts a check-run). A reusable workflow can never request
  # a permission its CALLER job did not grant, so this job must grant `checks:
  # write` (plus the `contents: read` the build jobs use) or the whole run fails
  # to start with a startup_failure. On a direct push/PR the workflow-level
  # default token already carries these, which is why this only bites via `uses:`.
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml
    with:
      linux_only: true

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-compress
      # Rust binary — nothing to `import`, so the language-import smoke is skipped.
      # The reusable workflow still runs its dual-arch HTTP /health boot smoke.
      smoke_import: ""
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
      # Validate the built image's transports against the signed vgi extension.
      # The worker *logic* is already exercised every run by the gating `ci` job
      # (all test/sql/*, three transports, two OSes), so here we only prove the
      # IMAGE's entrypoints speak the protocol:
      #   - stdio: smoke ONE file through `docker run … stdio` (the on-host mode);
      #   - HTTP : the FULL suite against a SINGLE warm container (end-to-end
      #            image check via the default `http` entrypoint + /health).
      # $CITEST_IMAGE is the loaded <image>:citest-amd64 ref; haybarn-unittest
      # is installed at the version pinned in the Makefile.
      image_test: |
        echo "::group::install haybarn-unittest (pinned: Makefile HAYBARN_VERSION, as ci.yml)"
        HAYBARN_VERSION="$(sed -n 's/^HAYBARN_VERSION *?= *//p' Makefile)"
        test -n "$HAYBARN_VERSION" || { echo "HAYBARN_VERSION not found in Makefile" >&2; exit 1; }
        if ! command -v uv >/dev/null; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
        fi
        uv venv -q --allow-existing .tools
        uv pip install -q -p .tools "haybarn-unittest==$HAYBARN_VERSION"
        export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
        echo "::endgroup::"

        echo "::group::stdio entrypoint smoke (one file, cold container per ATTACH)"
        TRANSPORT=stdio \
          TEST_PATTERN="test/sql/compress.test" \
          VGI_COMPRESS_WORKER="docker run -i --rm $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"

        echo "::group::full SQL suite — HTTP transport (one warm container)"
        CID=$(docker run -d -p 18000:8000 "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        TRANSPORT=http VGI_COMPRESS_WORKER="http://localhost:18000" ci/run-integration.sh
        echo "::endgroup::"
