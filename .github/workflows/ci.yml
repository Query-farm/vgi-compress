name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Allow release.yml to run this exact suite as a gating `uses:` job before it
  # publishes anything.
  workflow_call:
    inputs:
      linux_only:
        # release / publish callers set this: the same commit already ran the
        # full matrix (macOS included) on push, and the org's macOS runner pool
        # is small, so tagged gates run Linux only.
        description: Skip the macOS legs of the test matrix.
        type: boolean
        default: false

concurrency:
  # Include github.workflow so a direct CI run and the `uses:`-embedded CI jobs
  # of release.yml land in DISTINCT groups (in a reusable workflow github.workflow
  # resolves to the CALLER).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SQL test runner (haybarn-unittest) every SQL job installs.
  HAYBARN_VERSION: "2.0.0rc11"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt · clippy · doc · unit + proptest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests + property-based fuzzing (zero-panic gate)
        run: cargo test --workspace --all-features

      - name: Doc build (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

      - name: Build worker (release)
        run: cargo build --release --bin compress-worker

  integration:
    # SQL end-to-end: the SAME test/sql/*.test suite over each transport the vgi
    # extension supports; ci/run-integration.sh sets VGI_COMPRESS_WORKER per transport:
    # stdio = DuckDB spawns the worker; launch = DuckDB starts it once on a unix
    # socket and pools connections; http = `compress-worker --http`.
    name: SQL E2E (${{ matrix.transport }}) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.linux_only && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@v7

      - name: Build worker (release)
        run: cargo build --locked --release --bin compress-worker

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/target/release/compress-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  metadata-quality:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build worker (release)
        run: cargo build --release --bin compress-worker

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "${{ github.workspace }}/target/release/compress-worker"
          fail-on: info

  # Feature-matrix: also build/test the C `liblzma` xz backend (off by default).
  feature-liblzma:
    name: feature build (liblzma xz backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: liblzma

      - name: Build + test with --features liblzma
        run: |
          cargo build --workspace --features liblzma
          cargo test -p compress-core --features liblzma

  # Supply-chain advisory scan over the locked dependency tree (zstd, flate2,
  # brotli, lz4_flex, snap, lzma-rs, bzip2, arrow, vgi, …). Lightweight: no
  # compile, just reads Cargo.lock against the RustSec advisory DB.
  audit:
    name: supply-chain audit (cargo-audit)
    runs-on: ubuntu-latest
    # rustsec/audit-check posts a check-run, which needs checks:write; the
    # top-level `permissions: contents: read` alone yields
    # "Resource not accessible by integration - create-a-check-run".
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Verify the declared MSRV (rust-version = "1.97") actually builds.
  msrv:
    name: MSRV check (rust 1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (pinned MSRV)
        uses: dtolnay/rust-toolchain@1.97

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: cargo check (workspace, all features off-by-default)
        run: cargo check --workspace
